<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080C">
<title>SOPAC 2027 · Manual de identidad</title>
<meta name="description" content="Manual de identidad visual del Congreso Internacional de Oncología SOPAC 2027 · Asunción, 26 al 28 de agosto de 2027.">
<meta property="og:title" content="SOPAC 2027 · Manual de identidad visual">
<meta property="og:image" content="img/og.jpg">
<link rel="preload" as="image" href="img/s01-2560.webp" imagesrcset="img/s01-1280.webp 1280w, img/s01-2560.webp 2560w" imagesizes="100vw">
<style>
/* Layout: columna de láminas 16:9 a sangre, visor a pantalla completa, video al final */
:root{
  --noche:#05080C; --panel:#0B141C; --linea:#1B2A35;
  --texto:#EEF3F5; --suave:#93A7AF;
  --cian:#6EEAF2; --magenta:#E38BED;
  --sans:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--noche);color:var(--texto);font-family:var(--sans);-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(5,8,12,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--linea)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.marca{font-weight:700;letter-spacing:.02em;font-size:15px;white-space:nowrap}
.marca span{background:linear-gradient(90deg,var(--cian),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.acciones{display:flex;gap:8px}
.btn{appearance:none;border:1px solid var(--linea);background:var(--panel);color:var(--texto);font:600 13px/1 var(--sans);letter-spacing:.04em;padding:10px 14px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--cian)}
.btn:focus-visible,.slide:focus-visible,.hot:focus-visible{outline:2px solid var(--cian);outline-offset:3px}
.btn.prim{background:linear-gradient(90deg,var(--cian),var(--magenta));color:#05080C;border:0}
main .wrap{display:flex;flex-direction:column;gap:clamp(12px,2.2vw,28px);padding-block:clamp(14px,2.5vw,32px)}
.slide{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:clamp(6px,1vw,14px);overflow:hidden;background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.45);cursor:zoom-in;border:0;padding:0}
.slide img{display:block;width:100%;height:100%;object-fit:cover}
.hot{position:absolute;left:72.2%;top:72.4%;width:20%;height:16.9%;border-radius:999px;cursor:pointer;background:transparent;border:0}
.hot:hover{box-shadow:0 0 0 3px rgba(110,234,242,.6),0 0 40px rgba(110,234,242,.4)}
#video{scroll-margin-top:80px}
.video{display:flex;flex-direction:column;gap:14px}
.k{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--cian)}
.video h2{margin:0;font-size:clamp(22px,3vw,34px);text-wrap:balance}
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:clamp(6px,1vw,14px);overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--linea),0 30px 80px rgba(110,234,242,.10)}
.player video{display:block;width:100%;height:100%;background:#000}
.aviso{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:24px;text-align:center;background:linear-gradient(rgba(5,8,12,.55),rgba(5,8,12,.92)),url(img/poster.jpg) center/cover;justify-content:center}
.aviso p{margin:0;max-width:52ch;color:var(--suave);font-size:14px;line-height:1.5}
footer .wrap{padding-block:24px 40px;color:var(--suave);font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
/* visor */
.visor{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;touch-action:pan-y pinch-zoom}
.visor img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.visor .bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.6),transparent);font-size:13px;letter-spacing:.14em}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(5,8,12,.55);color:#fff;font-size:22px;cursor:pointer}
.nav.prev{left:max(12px,env(safe-area-inset-left,0px))}.nav.next{right:max(12px,env(safe-area-inset-right,0px))}
@media (hover:none){.nav{display:none}}
@media (max-width:560px){.acciones .btn.sec{display:none}.marca{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.slide{transition:transform .25s ease}.slide:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="marca">SOPAC <span>2027</span> · Manual de identidad</div>
  <div class="acciones">
    <button class="btn sec" id="abrir" type="button">Pantalla completa</button>
    <a class="btn prim" href="#video">▶ Ver video</a>
  </div>
</div></header>

<main><div class="wrap" id="lista"></div></main>

<section id="video"><div class="wrap video">
  <div class="k">Aplicaciones · video</div>
  <h2>SOPAC 2027 en movimiento</h2>
  <div class="player">
    <video id="vid" controls playsinline preload="metadata" poster="img/poster.jpg">
      <source src="video/sopac2027.webm" type="video/webm">
      <source src="video/sopac2027.mp4" type="video/mp4">
    </video>
    <div class="aviso" id="aviso" hidden>
      <p>El video no está junto a esta página. Puedes verlo en SharePoint con tu cuenta de TASSOS.</p>
      <a class="btn prim" target="_blank" rel="noopener" href="https://tassossa-my.sharepoint.com/:v:/g/personal/diseno_tassossa_onmicrosoft_com/IQDjT4a872czS7e7wtyDb3ASAZFbpz0d1u4RTcOeUO96Yfc?e=maqDMQ">Abrir el video</a>
    </div>
  </div>
</div></section>

<footer><div class="wrap"><span>Congreso Internacional de Oncología</span><span>Asunción · 26–28 agosto 2027</span></div></footer>

<div class="visor" id="visor" hidden role="dialog" aria-modal="true" aria-label="Visor de láminas">
  <div class="bar"><span id="cont">01 / 15</span><button class="btn" id="cerrar" type="button">Cerrar ✕</button></div>
  <img id="vimg" alt="">
  <button class="nav prev" id="ant" type="button" aria-label="Lámina anterior">‹</button>
  <button class="nav next" id="sig" type="button" aria-label="Lámina siguiente">›</button>
</div>

<script>
(function(){
  var N=15, titulos=["Portada","Concepto","Versiones del logotipo","Fondos claros y una tinta","Área de seguridad","Color","Tipografía","Fondos","Usos correctos","Usos incorrectos","Gráficos de apoyo","Escenario y pantalla LED","Piezas del congreso","Firma de correo","Cierre y video"];
  var lista=document.getElementById('lista');
  function src(i,w){return 'img/s'+String(i).padStart(2,'0')+'-'+w+'.webp';}
  for(var i=1;i<=N;i++){
    var b=document.createElement('div');
    b.className='slide';b.tabIndex=0;b.setAttribute('role','button');b.dataset.i=i;b.setAttribute('aria-label','Lámina '+i+': '+titulos[i-1]);
    var im=document.createElement('img');
    im.src=src(i,1280);im.srcset=src(i,1280)+' 1280w, '+src(i,2560)+' 2560w';
    im.sizes='(max-width:1632px) 100vw, 1600px';im.alt=titulos[i-1];im.decoding='async';
    if(i>2) im.loading='lazy'; else im.fetchPriority='high';
    im.width=2560;im.height=1440;
    b.appendChild(im);
    if(i===N){var h=document.createElement('a');h.className='hot';h.href='#video';h.setAttribute('aria-label','Ver video');h.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();irVideo();});b.appendChild(h);}
    lista.appendChild(b);
  }
  // video
  var vid=document.getElementById('vid'),aviso=document.getElementById('aviso'),fallos=0;
  vid.querySelectorAll('source').forEach(function(s){s.addEventListener('error',function(){if(++fallos>=2){aviso.hidden=false;vid.removeAttribute('controls');}});});
  function irVideo(){cerrar();document.getElementById('video').scrollIntoView({behavior:'smooth'});if(aviso.hidden){var p=vid.play();if(p&&p.catch)p.catch(function(){});}}
  document.querySelector('a.btn.prim[href="#video"]').addEventListener('click',function(e){e.preventDefault();irVideo();});
  // visor
  var visor=document.getElementById('visor'),vimg=document.getElementById('vimg'),cont=document.getElementById('cont'),act=1;
  function big(){return (window.devicePixelRatio||1)*Math.max(screen.width,screen.height)>1400?2560:1280;}
  function mostrar(i){act=Math.min(N,Math.max(1,i));vimg.src=src(act,big());vimg.alt=titulos[act-1];cont.textContent=String(act).padStart(2,'0')+' / '+N;
    if(act<N){var pre=new Image();pre.src=src(act+1,big());}}
  function abrir(i){mostrar(i);visor.hidden=false;document.body.style.overflow='hidden';
    if(visor.requestFullscreen){visor.requestFullscreen().catch(function(){});}
    try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(function(){});}catch(e){}}
  function cerrar(){if(visor.hidden)return;visor.hidden=true;document.body.style.overflow='';
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});
    var el=lista.children[act-1];if(el)el.scrollIntoView({block:'center'});}
  lista.addEventListener('click',function(e){var s=e.target.closest('.slide');if(s)abrir(+s.dataset.i);});
  lista.addEventListener('keydown',function(e){var s=e.target.closest('.slide');if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();abrir(+s.dataset.i);}});
  document.getElementById('abrir').addEventListener('click',function(){abrir(1);});
  document.getElementById('cerrar').addEventListener('click',cerrar);
  document.getElementById('ant').addEventListener('click',function(){mostrar(act-1);});
  document.getElementById('sig').addEventListener('click',function(){act===N?irVideo():mostrar(act+1);});
  document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&!visor.hidden){visor.hidden=true;document.body.style.overflow='';}});
  document.addEventListener('keydown',function(e){if(visor.hidden)return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();act===N?irVideo():mostrar(act+1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){mostrar(act-1);}
    else if(e.key==='Escape'){cerrar();}});
  var x0=null,y0=null;
  visor.addEventListener('touchstart',function(e){if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY;}else x0=null;},{passive:true});
  visor.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){dx<0?(act===N?irVideo():mostrar(act+1)):mostrar(act-1);} else if(dy>90){cerrar();} x0=null;},{passive:true});
  vimg.addEventListener('click',function(e){var r=vimg.getBoundingClientRect();
    if(act===N){var k=Math.min(r.width/16,r.height/9),cw=16*k,ch=9*k,ox=r.left+(r.width-cw)/2,oy=r.top+(r.height-ch)/2,fx=(e.clientX-ox)/cw,fy=(e.clientY-oy)/ch;if(fx>.70&&fx<.94&&fy>.70&&fy<.91){irVideo();return;}}
    (e.clientX-r.left)<r.width/3?mostrar(act-1):(act===N?irVideo():mostrar(act+1));});
})();
</script>
</body>
</html>
